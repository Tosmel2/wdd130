<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="An interactive HTML and CSS quiz to test your knowledge of web development.">
    <meta name="author" content="Tosin Adewale">
    <link rel="stylesheet" href="quiz.css">
    <title>HTML and CSS Quiz</title>
</head>

<body>

    <h1>HTML and CSS Quiz</h1>

    <form>
        <label for="q1">
            1. What does the acronym CSS stand for?
        </label>
        <br>
        <input type="text" id="q1" name="q1">
        <br>

        <label for="q2">
            2. How are id and class attributes selected in CSS?
        </label>
        <br>
        <textarea id="q2" name="q2" rows="5" cols="50"></textarea>
        <br>

        <label for="q3">
            3. Which of the following is a valid CSS comment?
        </label>
        <br>

        <select id="q3" name="q3">
            <option value="" selected disabled>Choose One ...</option>
            <option value="html-comment">&lt;!-- This is a comment --&gt;</option>
            <option value="css-comment">/* This is a comment */</option>
            <option value="js-comment">// This is a comment</option>
        </select>
        <br>

        <label for="q4">
            4. What is the bottom margin given this declaration?
        </label>
        <br>
        <code>margin: 10px 5px 15px;</code>
        <br>
        <input type="number" id="q4" name="q4">
        <br>

        <button type="submit">Submit Quiz</button>

    </form>

</body>

</html>
